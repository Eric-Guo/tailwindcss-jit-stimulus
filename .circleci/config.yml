---
version: 2.1
orbs:
  node: circleci/node@7.2.1
  browser-tools: circleci/browser-tools@1.2.1

jobs:
  build:
    docker:
      - image: cimg/ruby:3.3.3-browsers
        environment:
          BUNDLE_JOBS: 3
          BUNDLE_RETRY: 3
          BUNDLE_PATH: vendor/bundle
          RAILS_ENV: test
          NOKOGIRI_USE_SYSTEM_LIBRARIES: true

    working_directory: ~/tailwind-jit
    steps:
      - checkout
      - node/install:
          node-version: "22.13.0"

      # Which version of bundler? should keep same as Gemfile.lock
      - run:
          name: Install Bundler
          command: gem install bundler:4.0.20 && bundle -v

      # Restore bundle cache
      - restore_cache:
          keys:
            - tailwind-bundle-v3-{{ checksum "Gemfile.lock" }}

      - run:
          name: Bundle Install
          command: bundle check || bundle install

      # Store bundle cache
      - save_cache:
          key: tailwind-bundle-v3-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

      - run:
          name: Install pnpm 12.3.4
          command: |
            curl -fsSL https://get.pnpm.io/install.sh -o /tmp/install-pnpm.sh
            PNPM_VERSION=12.3.4 SHELL=/bin/bash sh /tmp/install-pnpm.sh
            echo 'export PNPM_HOME="$HOME/.local/share/pnpm"' >> "$BASH_ENV"
            echo 'export PATH="$PNPM_HOME:$PATH"' >> "$BASH_ENV"

      - restore_cache:
          keys:
            - tailwind-pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}

      - run:
          name: pnpm Install
          command: bin/pnpm install --frozen-lockfile --store-dir ~/.pnpm-store

      - save_cache:
          key: tailwind-pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store

      - browser-tools/install-chrome
      - browser-tools/install-chromedriver
      - run:
          command: |
            google-chrome --version
            chromedriver --version
          name: Check install

      # run tests!
      - run:
          name: run tests
          command: RAILS_ENV=test; bin/rails test

      # run integration tests!
      - run:
          name: run integration tests
          command: RAILS_ENV=test; bin/rails test:system
